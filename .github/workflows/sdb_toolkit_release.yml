# Builds SDB_toolkit.zip (only the SDB_toolkit folder, without tests) and publishes it:
#   - to the release of its version, sdb-toolkit-v<version> (created if missing; version from SDB_toolkit/pyproject.toml), and
#   - to the rolling release 'sdb-toolkit-latest', so this link always gives the newest version:
#     https://github.com/Alerovere/seastrong-field-tools/releases/download/sdb-toolkit-latest/SDB_toolkit.zip
# Runs by itself on every push to main that changes SDB_toolkit/ (a fixed version release keeps its first zip:
# bump the version in pyproject.toml for a new one), when a release sdb-toolkit-v<version> is published,
# or by hand: Actions > SDB toolkit zip > Run workflow (leave the tag empty for the current main).
name: SDB toolkit zip

on:
  push:
    branches: [main]
    paths: ['SDB_toolkit/**', '.github/workflows/sdb_toolkit_release.yml']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to rebuild, e.g. sdb-toolkit-v0.9.0 (empty = current main)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: sdb-toolkit-zip
  cancel-in-progress: false

jobs:
  zip:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'sdb-toolkit-v')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GIVEN_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.sha }}

      - name: Version and release tag
        run: |
          v=$(python3 -c "import tomllib; print(tomllib.load(open('SDB_toolkit/pyproject.toml','rb'))['project']['version'])")
          tag="sdb-toolkit-v$v"
          if [ -n "$GIVEN_TAG" ] && [ "$GIVEN_TAG" != "$tag" ]; then
            echo "::error::Tag $GIVEN_TAG does not match SDB_toolkit/pyproject.toml version $v (expected $tag)"; exit 1
          fi
          echo "VERSION=$v" >> "$GITHUB_ENV"; echo "TAG=$tag" >> "$GITHUB_ENV"; echo "SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Build SDB_toolkit.zip
        run: |
          zip -r -q SDB_toolkit.zip SDB_toolkit \
            -x 'SDB_toolkit/tests/*' 'SDB_toolkit/outputs/*' 'SDB_toolkit/_backup_src_*' \
               '*/__pycache__/*' '*.egg-info/*' '*.DS_Store'
          unzip -l SDB_toolkit.zip | tail -3

      - name: Release of this version
        run: |
          notes="SDB toolkit version $VERSION (the SDB_toolkit folder of this repository). Download SDB_toolkit.zip, unzip it into a folder of your Google Drive and open notebooks/seastrong_toolkit_colab.ipynb from there."
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ -n "$GIVEN_TAG" ]; then gh release upload "$TAG" SDB_toolkit.zip --clobber
            else echo "Release $TAG already exists: its zip is kept (bump the version for a new release)."; fi
          else
            gh release create "$TAG" SDB_toolkit.zip --target "$SHA" --title "SDB toolkit $VERSION" --notes "$notes" --latest=false
          fi

      - name: Rolling release sdb-toolkit-latest
        run: |
          notes="SDB toolkit only (the SDB_toolkit folder of this repository), currently version $VERSION (commit ${SHA:0:7}). Download SDB_toolkit.zip, unzip it into a folder of your Google Drive and open notebooks/seastrong_toolkit_colab.ipynb from there."
          if gh release view sdb-toolkit-latest >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/sdb-toolkit-latest" -f sha="$SHA" -F force=true >/dev/null
            gh release edit sdb-toolkit-latest --title "SDB toolkit (latest: $VERSION)" --notes "$notes" --latest=false
          else
            gh release create sdb-toolkit-latest --target "$SHA" --title "SDB toolkit (latest: $VERSION)" --notes "$notes" --latest=false
          fi
          gh release upload sdb-toolkit-latest SDB_toolkit.zip --clobber
