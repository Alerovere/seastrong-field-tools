# Builds Wave_climate.zip (only the Wave_climate folder, without tests) when a release with a tag
# wave-climate-v<version> is published, e.g. wave-climate-v0.1.0, and attaches it:
#   - to that release (a fixed version), and
#   - to the rolling release 'wave-climate-latest', so this link always gives the newest version:
#     https://github.com/Alerovere/seastrong-field-tools/releases/download/wave-climate-latest/Wave_climate.zip
# The tag must match the version in Wave_climate/pyproject.toml.
name: Wave climate zip

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to (re)build the zip for, e.g. wave-climate-v0.1.0'
        required: true

permissions:
  contents: write

jobs:
  zip:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'wave-climate-v')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Check that the tag matches the package version
        run: |
          v=$(python3 -c "import tomllib; print(tomllib.load(open('Wave_climate/pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG" != "wave-climate-v$v" ]; then
            echo "::error::Tag $TAG does not match Wave_climate/pyproject.toml version $v (expected wave-climate-v$v)"; exit 1
          fi
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Build Wave_climate.zip
        run: |
          zip -r -q Wave_climate.zip Wave_climate \
            -x 'Wave_climate/tests/*' 'Wave_climate/outputs/*' 'Wave_climate/_backup_src_*' \
               '*/__pycache__/*' '*.egg-info/*' '*.DS_Store'
          unzip -l Wave_climate.zip

      - name: Attach to this release
        run: gh release upload "$TAG" Wave_climate.zip --clobber

      - name: Attach to the rolling release wave-climate-latest
        run: |
          notes="Wave climate tool only (the Wave_climate folder of this repository), currently version $VERSION (release $TAG). Download Wave_climate.zip, unzip it into a folder of your Google Drive and open notebooks/wave_climate_colab.ipynb from there."
          if gh release view wave-climate-latest >/dev/null 2>&1; then
            gh release edit wave-climate-latest --title "Wave climate (latest: $VERSION)" --notes "$notes" --latest=false
          else
            gh release create wave-climate-latest --target "$GITHUB_SHA" --title "Wave climate (latest: $VERSION)" --notes "$notes" --latest=false
          fi
          gh release upload wave-climate-latest Wave_climate.zip --clobber
