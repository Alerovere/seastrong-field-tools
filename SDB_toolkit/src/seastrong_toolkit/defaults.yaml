# SEASTRONG coastal toolkit — default options of every step.
# You do not edit this file: the Colab notebook shows every option of every step in its own cell and passes them with
# ctx.set(step, {...}). Options not given there take the value below. Each step has its own options hash: changing
# a step's options re-runs only that step (and the steps that use its outputs), in a new Drive folder.

project:
  AOI_ASSET: projects/YOUR_PROJECT/assets/belize_south_aoi   # used if AOI_GEOJSON is null
  AOI_GEOJSON: null          # e.g. /content/drive/MyDrive/SEASTRONG/aoi_belize_south.geojson (WGS84)
  CRS: EPSG:32616            # WGS 84 / UTM 16N (southern Belize)
  GRID_SNAP: 60              # m: grid origin snapped to this, so 10/20/30/60 m outputs nest exactly
  PREFIX: Belize_south       # file-name prefix
  FOLDER_ROOT: SEASTRONG_Belize_south   # Drive folder prefix
  DRIVE_ROOT: /content/drive/MyDrive    # where Google Drive is mounted in Colab
  COPDEM_COLLECTION: COPERNICUS/DEM/GLO30_2024_1   # Copernicus DEM release (DSM + water mask)
  WAVE_REGION: global        # Copernicus Marine model: 'global' or 'med' (Mediterranean)
  RUN_TAG: ''                # change (e.g. 'v2') to force new output folders with identical settings

run:                         # how steps run (not part of any settings hash)
  WAIT_FOR_EXPORTS: true     # block until Earth Engine exports are COMPLETED (needed by later steps)
  WAIT_TIMEOUT_H: 12
  DRIVE_SYNC_TIMEOUT_S: 900

# ---------------- Module 0: waves, wind and rain at a point (direct Copernicus Marine and CDS access) ----------------
waves:
  POINT: [-88.30, 16.10]     # lon, lat: deep water seaward of the barrier reef
  MODE: full                 # 'full' = entire records; 'screening' = only the Sentinel-2 months
  ERA5_START: '1940-01-01'
  CMEMS_START: null          # null = start of the chosen Copernicus Marine product
  END: null                  # null = latest available; or 'YYYY-MM-DD'
  CMEMS: true
  ERA5: true
  ERA5_WIND: true            # 10 m wind + total precipitation (same CDS request)
  CMEMS_VARIABLES: {VHM0: hs, VTPK: tp, VTM10: tm10, VMDR: mwd}
  ERA5_API: timeseries       # 'timeseries' (point time-series service, fast) or 'gridded'
  ERA5_TS_CHUNK_YEARS: 20
  ERA5_LAG_DAYS: 6
  ERA5T_REFRESH_DAYS: 90
  ERA5T_MAX_AGE_DAYS: 7
  ERA5_SEARCH_DEG: 0.75      # box searched for the nearest ERA5 sea cell (<= 1 deg)
  ERA5_VARIABLES:
    significant_height_of_combined_wind_waves_and_swell: hs
    mean_wave_period: tm
    peak_wave_period: tp
    mean_wave_direction: mwd
    10m_u_component_of_wind: u10
    10m_v_component_of_wind: v10
    total_precipitation: rain_mm
  ERA5_CHUNK_MONTHS: 3       # 'gridded' API only
  CDS_RETRIES: 3
  SCREEN_SOURCE: max         # Hs used by the Sentinel-2 date screen: 'cmems', 'era5' or 'max'
  SCREENING_YEARS: [2020, 2026]   # 'screening' mode only: years to download
  SCREENING_MONTHS: [2, 4]        # 'screening' mode: months to download; also shaded in the wave figure
  PLOT_HS_THRESHOLD: 1.5          # Hs line drawn in the wave figure (m)

# ---------------- Pre-screening: which months suit a Sentinel-2 composite? ----------------
prescreen:
  YEARS: [2000, 2026]        # years for sea-state and rain statistics (Sentinel-2 counts start in 2017)
  ORBIT: 40                  # Sentinel-2 relative orbit (null = all); use the same as the composite
  CS_THRESHOLD: 0.65         # Cloud Score+ threshold for a clear pixel
  PIXEL_MAX_SWIR: 0.02       # SWIR reflectance above which clear water counts as glint
  COMPARE_MONTHS: [2, 4]     # a window to compare with the ranking (e.g. the months used so far)
  OVERPASS_UTC: 16.3         # typical Sentinel-2 overpass time over the AOI (h UTC)
  WAVE_WINDOW_H: 48          # waves: max Hs over this many hours before the overpass
  WIND_WINDOW_H: 24          # wind: mean speed over this many hours before the overpass
  RAIN_DAYS: 5               # rain: sum over the whole days before the image
  RAIN_BUFFER: 40000         # CHIRPS area: AOI + this buffer (m), to include nearby catchments
  PCTL: {hs: 75, wind: 75, rain_era5: 75, rain_chirps: 75, turbidity: 75}   # good if at/below this site percentile (all months);
                             # 75 = not among the worst 25 % of days. All four together are much stricter than any one.
  ABS_CAPS: {hs: 1.5, wind: 6.0, rain_era5: 25.0, rain_chirps: 25.0}       # and never above these limits (null = none)
  CLEAR_MIN: 0.6             # a scene is usable if at least this share of AOI water is cloud-free
  SENSORS: [S2, LANDSAT]     # scene statistics from Earth Engine: S2, LANDSAT, HLS
  LANDSAT_YEARS: [1984, 2026]
  OCEAN_COLOUR: true         # Copernicus Marine ocean-colour transparency (daily AOI median)
  OC_DATASETS:
    global: {id: cmems_obs-oc_glo_bgc-transp_my_l3-olci-4km_P1D, variables: [SPM, ZSD, KD490]}
    med: {id: cmems_obs-oc_med_bgc-transp_my_l3-olci-300m_P1D, variables: [KD490]}
  OC_BUFFER_DEG: 0.05
  WINDOW_LENGTHS: [2, 3, 4]  # composite window lengths (months) to rank
  TOP_N: 5
  STAT_SCALE: 100            # m, scene statistics

# ---------------- Module 1: Sentinel-2 composite ----------------
s2:
  YEARS: [2020, 2026]
  MONTHS: [2, 4]             # choose with the pre-screening results
  MAX_TILE_CLOUD: 70
  CS_THRESHOLD: 0.65
  ORBIT: 40                  # single relative orbit; null = all
  PERCENTILE: 30
  MIN_VALID: 5
  SCALE: 10
  SENSITIVITY_MEDIAN: true
  GROUP_BY: MGRS_TILE
  GROUPS: [16QCD, 16PCC, 16PBC, 16QBD]   # reference first; [] = no matching
  WATER_NDWI: 0.2
  WATER_NIR: 0.05
  MATCH_BUFFER: 10000
  OFFSET_SCALE: 100
  MIN_MATCH_PIXELS: 50
  OFFSET_MAX: 0.01
  NO_WATER_FALLBACK: zero    # 'zero' (flagged), 'all', 'error'
  GLINT_FILTER: true
  PIXEL_MAX_SWIR: 0.02
  SCENE_MAX_NIR: 0.03
  TURBIDITY_FILTER: true
  SCENE_MAX_B5: 0.03
  RAIN_FILTER: true
  RAIN_DAYS: 5
  RAIN_MAX_MM: 25
  RAIN_BUFFER: 40000
  WIND_FILTER: true
  WIND_SOURCE: cds           # 'cds' = ERA5 point series from the waves step; 'gee' = ERA5 area mean in Earth Engine
  WIND_WINDOW_H: 3
  WIND_MAX_MS: 6
  WIND_BUFFER: 20000
  WAVE_FILTER: true
  WAVE_WINDOW_H: 6
  WAVE_MAX_HS: 1.5
  MISSING_POLICY: {waves: drop, wind: drop, rain: drop, water: drop}
  SCENE_STAT_SCALE: 200
  B1_FROM_B2: false
  EXCLUDE_DATES: null
  FIXED_OFFSETS: null

dem:
  SCALE: 30

habitats:
  AREA_SCALE_ACA: 5
  AREA_SCALE_GMW: 10

transport:
  TURB_SOURCE: HLS
  A_YEARS: [2013, 2026]
  CS_THRESHOLD: 0.65
  C_YEARS: [1984, 2026]
  C_PERIODS: [[1984, 1999], [2000, 2012], [2013, 2026]]
  USE_L7_SLC_OFF: true
  D_YEARS: [1984, 2026]
  ST_VALID_C: [15, 40]
  ST_MAX_UNC_K: 1.5
  ST_MIN_CDIST_KM: 1.0
  ST_REF_GEOJSON: null
  ST_REF_MIN_COVER: 0.5
  TURB_A: 228.1
  TURB_C: 0.1641
  PIXEL_MAX_SWIR: 0.02
  PLUME_DT: 5
  DRY_MONTHS: [2, 4]
  WET_MONTHS: [6, 11]
  RAIN_DAYS: 5
  RAIN_WET_MM: 40
  RAIN_DRY_MM: 5
  RAIN_BUFFER: 40000
  SECTORS: {N: [315, 45], E: [45, 135], S: [135, 225], W: [225, 315]}
  MIN_SUPPORT: 5
  CUR_YEARS: [2015, 2024]
  CUR_BUFFER: 60000
  PARTS: {A: true, B: true, C: true, D: true}

icesat2:
  T0: '2018-10-13'
  T1: null
  SR_RETRIES: 3
  ON_MISSING_QC_FIELD: fail
  MIN_CONFIDENCE: 0.6
  MAX_SIGMA_TVU: 1.0
  DEPTH_MIN: 0.3
  DEPTH_MAX: 40.0
  SHORE_BUFFER: 20.0
  LAND_BUFFER_M: 2000
  SHORELINE_FILE: null
  SPIKE_WINDOW: 15
  SPIKE_MIN: 0.5
  VALID_SHARE: 0.25
  MIN_RGT_TOTAL: 4
  MIN_RGT_VALID: 1
  MIN_PHOTONS_SIDE: 50
  HOLDOUT_LOCK: null
  XT_RADIUS: 30.0
  XT_MIN: 1.0
  XT_REL: 0.20
  XT_MIN_PASSES: 3
  XT_BIN: 10.0
  XT_APPLY_TO_VALID: false
  SDB_BIN: 0.5
  SDB_MIN_PER_BIN: 30
  SDB_MIN_RGT_PER_BIN: 2
  SDB_FLAT_TOL: 0.05
  SDB_FLAT_SPAN: 3.0
  SDB_MIN_PHOTONS: 500
  SDB_MIN_RGT: 3
  SDB_BOOT: 200
  SDB_MIN_RHO: 0.3
  SDB_SENS: {SDB_BIN: [0.25, 0.5, 1.0], SDB_FLAT_TOL: [0.03, 0.05, 0.08], SDB_FLAT_SPAN: [2.0, 3.0, 4.0]}
  COMPOSITE_TIF: null
  MASK_MIN_AREA_PX: 50
  RUN_ATL08: true
  ATL08_LEN: 100
  MIN_GROUND_PH: 5
  MANGROVE_BUFFER_PX: 1
  GROUND_RANGE: [-3.0, 6.0]
