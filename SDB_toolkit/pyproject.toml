[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seastrong_toolkit"
version = "0.7.0"
description = "SEASTRONG WP1 coastal toolkit: Sentinel-2 composites for satellite-derived bathymetry, wave/wind/rain pre-screening, DEMs, habitats, transport tracers and ICESat-2 (Earth Engine + Copernicus + SlideRule)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
# Packages that Colab already ships (earthengine-api, google-auth, numpy, pandas, ...) are deliberately left
# unpinned so pip never replaces Colab's own versions (see the constraints step in the notebook).
dependencies = [
    "earthengine-api",
    "pyyaml",
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "xarray",
    "netCDF4",
    "h5netcdf",
    "pyarrow",
    "tabulate",
    "rasterio>=1.3",
    "geopandas>=0.14",
    "pyproj>=3.6",
    "shapely>=2.0",
    "cdsapi>=0.7.7",
    "copernicusmarine>=2.5",
    "sliderule>=5.8",
]

[project.optional-dependencies]
maps = ["geemap"]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
seastrong_toolkit = ["defaults.yaml"]
