# Builds ICESat2_tool.zip (only the ICESat2_tool folder, without tests) and publishes it:
#   - to the release of its version, icesat2-tool-v<version> (created if missing; version from ICESat2_tool/pyproject.toml), and
#   - to the rolling release 'icesat2-tool-latest', so this link always gives the newest version:
#     https://github.com/Alerovere/seastrong-field-tools/releases/download/icesat2-tool-latest/ICESat2_tool.zip
# Runs by itself on every push to main that changes ICESat2_tool/ (a fixed version release keeps its first zip:
# bump the version in pyproject.toml for a new one), when a release icesat2-tool-v<version> is published,
# or by hand: Actions > ICESat-2 tool zip > Run workflow (leave the tag empty for the current main).
name: ICESat-2 tool zip

on:
  push:
    branches: [main]
    paths: ['ICESat2_tool/**', '.github/workflows/icesat2_tool_release.yml']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to rebuild, e.g. icesat2-tool-v0.1.0 (empty = current main)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: icesat2-tool-zip
  cancel-in-progress: false

jobs:
  zip:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'icesat2-tool-v')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GIVEN_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.sha }}

      - name: Version and release tag
        run: |
          v=$(python3 -c "import tomllib; print(tomllib.load(open('ICESat2_tool/pyproject.toml','rb'))['project']['version'])")
          tag="icesat2-tool-v$v"
          if [ -n "$GIVEN_TAG" ] && [ "$GIVEN_TAG" != "$tag" ]; then
            echo "::error::Tag $GIVEN_TAG does not match ICESat2_tool/pyproject.toml version $v (expected $tag)"; exit 1
          fi
          echo "VERSION=$v" >> "$GITHUB_ENV"; echo "TAG=$tag" >> "$GITHUB_ENV"; echo "SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Build ICESat2_tool.zip
        run: |
          zip -r -q ICESat2_tool.zip ICESat2_tool \
            -x 'ICESat2_tool/tests/*' 'ICESat2_tool/outputs/*' 'ICESat2_tool/_backup_src_*' \
               '*/__pycache__/*' '*.egg-info/*' '*.DS_Store'
          unzip -l ICESat2_tool.zip | tail -3

      - name: Release of this version
        run: |
          notes="ICESat-2 tool version $VERSION (the ICESat2_tool folder of this repository). Download ICESat2_tool.zip, unzip it into a folder of your Google Drive and open notebooks/icesat2_colab.ipynb from there."
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ -n "$GIVEN_TAG" ]; then gh release upload "$TAG" ICESat2_tool.zip --clobber
            else echo "Release $TAG already exists: its zip is kept (bump the version for a new release)."; fi
          else
            gh release create "$TAG" ICESat2_tool.zip --target "$SHA" --title "ICESat-2 tool $VERSION" --notes "$notes" --latest=false
          fi

      - name: Rolling release icesat2-tool-latest
        run: |
          notes="ICESat-2 tool only (the ICESat2_tool folder of this repository), currently version $VERSION (commit ${SHA:0:7}). Download ICESat2_tool.zip, unzip it into a folder of your Google Drive and open notebooks/icesat2_colab.ipynb from there."
          if gh release view icesat2-tool-latest >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/icesat2-tool-latest" -f sha="$SHA" -F force=true >/dev/null
            gh release edit icesat2-tool-latest --title "ICESat-2 tool (latest: $VERSION)" --notes "$notes" --latest=false
          else
            gh release create icesat2-tool-latest --target "$SHA" --title "ICESat-2 tool (latest: $VERSION)" --notes "$notes" --latest=false
          fi
          gh release upload icesat2-tool-latest ICESat2_tool.zip --clobber
