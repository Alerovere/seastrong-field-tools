[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "icesat2_tool"
version = "0.1.0"
description = "ICESat-2 ATL24 bathymetry with transparent quality control and locked training / validation tracks, and ATL08 ground / canopy heights (SlideRule)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "geopandas>=0.14",
    "shapely>=2.0",
    "pyproj>=3.6",
    "pyarrow",
    "rasterio>=1.3",
    "tabulate",
    "sliderule>=5.8",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
